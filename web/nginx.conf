limit_req_zone $binary_remote_addr zone=pttv_req:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=pttv_conn:10m;

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Resolve the proxy per request instead of once at
  # start-up: when the proxy container is recreated it gets a new address, and
  # nginx would otherwise keep the stale one and answer 502 on every stream.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $pttv_proxy http://proxy:3000;

  # Security headers at SERVER level. Do not put add_header inside a location:
  # nginx drops inherited add_header directives the moment a location declares one.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Streaming endpoints -> the proxy service (same compose network).
  location = /channels {
    proxy_pass $pttv_proxy;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /stream/ {
    limit_req zone=pttv_req burst=60 nodelay;
    limit_conn pttv_conn 20;
    proxy_pass $pttv_proxy;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_hide_header Server;
  }

  location /live/ {
    limit_req zone=pttv_req burst=60 nodelay;
    limit_conn pttv_conn 20;
    proxy_pass $pttv_proxy;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_hide_header Server;
  }

  location = /seg {
    limit_req zone=pttv_req burst=120 nodelay;
    limit_conn pttv_conn 30;
    proxy_pass $pttv_proxy;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_hide_header Server;
  }

  location = /healthz {
    default_type text/plain;
    return 200 "ok";
  }
}
