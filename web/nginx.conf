server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers at SERVER level. Do not put add_header inside a location:
  # nginx drops inherited add_header directives the moment a location declares one.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Streaming endpoints -> the proxy service (same compose network).
  location = /channels {
    proxy_pass http://proxy:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /stream/ {
    proxy_pass http://proxy:3000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
  }

  location = /seg {
    proxy_pass http://proxy:3000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
  }

  location = /healthz {
    default_type text/plain;
    return 200 "ok";
  }
}
