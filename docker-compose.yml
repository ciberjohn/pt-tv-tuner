services:
  proxy:
    build: ./proxy
    image: pt-tv-tuner-proxy:local
    container_name: pttv-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    mem_limit: 256m
    pids_limit: 128
    environment:
      PORT: "3000"
      CHANNELS_FILE: /app/data/channels.json
    volumes:
      - ./data/channels.json:/app/data/channels.json:ro
    networks:
      - pttv
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build: ./web
    image: pt-tv-tuner-web:local
    container_name: pttv-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    mem_limit: 128m
    pids_limit: 128
    depends_on:
      - proxy
    ports:
      # Loopback only by default. Expose via Tailscale Serve or a Cloudflare tunnel.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8090}:8080"
    networks:
      - pttv

  landing:
    build: ./landing
    image: pt-tv-tuner-landing:local
    container_name: pttv-landing
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    mem_limit: 64m
    pids_limit: 64
    ports:
      - "${LANDING_BIND:-127.0.0.1}:${LANDING_PORT:-8091}:8080"
    networks:
      - pttv

networks:
  pttv:
    driver: bridge
    ipam:
      config:
        # Explicit, non-overlapping subnet so an advertised tailnet route
        # (172.20/172.27/172.31 etc.) can never shadow this bridge.
        - subnet: 172.30.77.0/24
